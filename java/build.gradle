plugins {
    id 'application'
}

group = 'com.example'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'com.example.raftkv.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

tasks.register('coreTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.raftkv.RaftCoreTest'
    enableAssertions = true
}

tasks.register('chaosTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.raftkv.ChaosHarness'
    args = ['1000']
    enableAssertions = true
}

tasks.named('check') {
    dependsOn coreTest, chaosTest
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}
